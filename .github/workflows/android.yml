# Builds the Google Play bundle (.aab). Run it from Actions → "Android bundle" → Run workflow,
# then download the "tavinda-aab" artifact and upload it in Play Console.
# Signing needs four repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
#   ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD
# Without them the bundle is signed with the debug key: it proves the build works, Play rejects it.
name: Android bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (empty = run number; must be higher than the last upload)'
        required: false
  push:
    branches: [claude/cool-johnson-itf1wl]
    paths:
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Tests
        run: npx jest --ci

      - name: Generate android/
        run: npx expo prebuild -p android --no-install

      - name: Upload key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Check signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee "$RUNNER_TEMP/cert.txt"
          if [ -n "$KEYSTORE_B64" ] && grep -q "CN=Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::error::Bundle is debug-signed although the upload key is set"; exit 1
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No upload key secrets: this bundle is debug-signed and Google Play will reject it."
          fi
          echo "versionCode $ANDROID_VERSION_CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KEYSTORE_B64 != '' && format('tavinda-aab-{0}', env.ANDROID_VERSION_CODE) || 'debug-signed-not-for-play' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
